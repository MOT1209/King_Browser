name: CodeQL

# Static analysis of the TypeScript/JavaScript sources (main process, preloads,
# renderer, MCP bridge). Findings appear under Security > Code scanning; treat
# each as a claim to verify against the source (see the
# security-regression-testing skill), not as a confirmed vulnerability.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - node_modules
              - dist
              - dist-electron
              - dist-test
              - video
              - website/dist

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

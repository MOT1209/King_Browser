name: Release

# Builds installers for macOS, Windows and Linux and publishes them as GitHub
# releases. There are two kinds:
#
#   nightly  - one rolling pre-release named "nightly". Every push to main
#              rebuilds it and REPLACES it, so there is always a single, newest
#              download of main and no pile of releases. It is a pre-release, so
#              the app's auto-updater and the website's /releases/latest links
#              ignore it. Use it to try the newest code.
#   v<version> - a normal release. It is created once per version: merging a
#              change to main that raises "version" in package.json publishes
#              v<version> (and only if that tag does not exist yet). A pushed
#              v* tag or a manual run also publishes it. The website and the
#              auto-updater use these.
#
# Why not overwrite one fixed version for every update: the auto-updater decides
# by comparing version numbers, so an update with the same number is never
# offered to installed apps; checksums and bug reports would also stop matching
# a version. Nightly gives the "one always-fresh download" without that.
#
# Code signing is optional and driven by repository secrets. Without them the
# builds are produced unsigned (macOS Gatekeeper and Windows SmartScreen warn).
#   macOS:   CSC_LINK (base64 .p12), CSC_KEY_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD

on:
  push:
    tags: ['v*']
    branches: [main]
    # Changes that cannot alter the app do not need a new build.
    paths-ignore: ['**.md', 'docs/**', 'website/**', 'video/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

# Runs for the same ref are queued, never run side by side, so two merges cannot
# publish over each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Decides what this run publishes. A push to main always refreshes nightly and
  # also publishes v<version> when that tag does not exist yet. Tag pushes and
  # manual runs publish the versioned release only.
  check:
    runs-on: ubuntu-latest
    outputs:
      nightly: ${{ steps.decide.outputs.nightly }}
      versioned: ${{ steps.decide.outputs.versioned }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide
        id: decide
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "nightly=false" >> "$GITHUB_OUTPUT"
            echo "versioned=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "nightly=true" >> "$GITHUB_OUTPUT"
          version="$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists; only nightly is refreshed."
            echo "versioned=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${version} has no tag; releasing it too."
            echo "versioned=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: pack:mac
          - os: windows-latest
            script: pack:win
          - os: ubuntu-latest
            script: pack:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build installers
        shell: bash
        # Signing is opt-in. An unset secret reaches the job as an empty string,
        # and electron-builder reads an empty CSC_LINK as a file path (the
        # project directory) and fails with "not a file". Drop the variables
        # entirely when there is no certificate and build unsigned.
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # King Cloud auth is compiled in by Vite. Without these the released
          # binary can only run in local-vault mode, which is a silent feature
          # regression rather than a build failure. Leaving them unset keeps the
          # local-only behaviour and is not an error.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist-electron-builder/*.dmg
            dist-electron-builder/*.zip
            dist-electron-builder/*.exe
            dist-electron-builder/*.AppImage
            dist-electron-builder/*.deb
            dist-electron-builder/latest*.yml
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Release tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: release-files
        run: sha256sum $(ls | grep -v '\.yml$') > SHA256SUMS.txt

      - name: Publish nightly
        if: needs.check.outputs.nightly == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (latest build of main)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: 'false'
          draft: false
          # Refresh the rolling nightly in place: same-named assets are
          # replaced, so a failed run can never delete the nightly and the
          # download link never 404s between pushes. The git tag stays where
          # the previous successful build put it; the release body names the
          # exact commit these assets were built from.
          overwrite_files: true
          body: |
            Rolling build of `main` at commit ${{ github.sha }}. It is replaced on every push to `main`.
            Unsigned. For trying the newest code; use a versioned release for everyday use.
          files: release-files/*

      - name: Publish v-release
        if: needs.check.outputs.versioned == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          files: release-files/*

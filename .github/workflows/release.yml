name: Release

# Builds installers for macOS, Windows and Linux and publishes them as a GitHub
# release. Start it by pushing a tag such as v0.0.1, or run it manually: a manual
# run releases the version in package.json as tag v<version> on the chosen branch.
# The website links to /releases/latest/download/..., which only resolves for a
# published (non-draft) release, so the release is published directly.
#
# Code signing is optional and driven by repository secrets. Without them the
# builds are produced unsigned (macOS Gatekeeper and Windows SmartScreen warn).
#   macOS:   CSC_LINK (base64 .p12), CSC_KEY_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: pack:mac
          - os: windows-latest
            script: pack:win
          - os: ubuntu-latest
            script: pack:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build installers
        shell: bash
        # Signing is opt-in. An unset secret reaches the job as an empty string,
        # and electron-builder reads an empty CSC_LINK as a file path (the
        # project directory) and fails with "not a file". Drop the variables
        # entirely when there is no certificate and build unsigned.
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist-electron-builder/*.dmg
            dist-electron-builder/*.zip
            dist-electron-builder/*.exe
            dist-electron-builder/*.AppImage
            dist-electron-builder/*.deb
            dist-electron-builder/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: release-files
        run: sha256sum $(ls | grep -v '\.yml$') > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          files: release-files/*

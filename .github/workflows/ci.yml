name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tests run in plain Node; the Electron binary and native ONNX runtime
      # downloads done by postinstall scripts are not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Only what ships: devDependencies (Remotion video tooling, build tools)
      # never reach users. Their advisories are tracked in
      # docs/engineering/quality-baseline.md instead of failing every PR.
      - name: Production dependency audit
        run: npm run audit:prod

      - name: Interface translations
        run: npm run check:i18n && npm run check:strings

      # mcp-bridge.mjs is what ships and what users point their MCP config at;
      # it is generated from mcp-bridge.ts and must not drift from it.
      - name: MCP bridge matches its source
        run: npm run build:bridge && git diff --exit-code mcp-bridge.mjs

      # The pretest step builds the renderer (vite) and the Electron bundles.
      - name: Build and test
        run: npm test

      - name: Website install
        run: npm --prefix website ci --no-audit --no-fund

      - name: Website build
        run: npm run build:website

      - name: Website tests
        run: npm --prefix website test

  # Windows is where the first release targets. It passed on the PR and on main
  # (two runs), so it now blocks merges like the Linux job.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build and test
        run: npm test

  # macOS has not run the suite before, so it reports without blocking merges
  # until it has passed a few times; remove continue-on-error then.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build and test
        run: npm test

  # Launches the built app under Playwright: runtime security preferences of
  # the window and a guest page, tab shortcuts, and an axe scan
  # (tests/electron). New job, so it reports without blocking merges until it
  # has passed a few times, like test-macos; remove continue-on-error then.
  electron-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the onnxruntime-node download the app does not
      # need here; the Electron binary is fetched explicitly instead.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Build
        run: npm run build

      # Ubuntu 24.04 restricts unprivileged user namespaces, so Chromium needs
      # its setuid sandbox helper. Configuring it keeps the sandbox ON; never
      # pass --no-sandbox to get this job green.
      - name: Enable Chromium setuid sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Electron smoke and accessibility checks
        run: xvfb-run -a npm run test:electron

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-e2e-results
          path: test-results/electron
          retention-days: 7

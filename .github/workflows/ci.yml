name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tests run in plain Node; the Electron binary and native ONNX runtime
      # downloads done by postinstall scripts are not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The pretest step builds the renderer (vite) and the Electron bundles.
      - name: Build and test
        run: npm test

      - name: Website install
        run: npm --prefix website ci --no-audit --no-fund

      - name: Website build
        run: npm run build:website

      - name: Website tests
        run: npm --prefix website test

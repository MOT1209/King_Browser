# Dependabot configuration
# Version updates are off on purpose (open-pull-requests-limit: 0): pinned
# action SHAs and dependency ranges are bumped by hand. There is no ignore
# rule, so Dependabot security updates can still open pull requests for known
# vulnerabilities when they are enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
